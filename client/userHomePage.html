<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}


header{

    background:#2196f3;
    color:white;

    padding:15px 30px;

    display:flex;
    justify-content:space-between;
    align-items:center;

}


.profile-icon{

    width:45px;
    height:45px;

    border-radius:50%;

    background:white;
    color:#2196f3;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    font-size:22px;

}


.profile-card{

    position:absolute;

    top:75px;
    right:20px;

    width:350px;

    background:white;

    padding:20px;

    border-radius:10px;

    box-shadow:0 5px 20px rgba(0,0,0,.2);

    display:none;

}


.profile-card h3{

    text-align:center;

    margin-bottom:20px;

}


.profile-img{

    width:120px;
    height:120px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #2196f3;

}



.field{

    margin-bottom:15px;

}


.field label{

    display:block;

    margin-bottom:5px;

    font-weight:bold;

}



.field input{

    width:100%;

    padding:10px;

    border:1px solid #ccc;

    border-radius:5px;

}



button{

    width:100%;

    padding:10px;

    border:none;

    border-radius:5px;

    cursor:pointer;

    margin-top:10px;

}



.edit-btn,
.save-btn,
.update-btn{

    background:#2196f3;

    color:white;

}



.close-btn{

    background:#f44336;

    color:white;

}



.logout-btn{

    background:#f44336;

    color:white;

}



button:hover{

    opacity:.85;

}

.profile-icon img{

    width:45px;
    height:45px;

    border-radius:50%;

    object-fit:cover;

}


</style>


</head>


<body>


<header>

<h2>
Welcome, <span id="userName">User</span>
</h2>


<div class="profile-icon" onclick="toggleProfile()">

    <img 
    id="headerProfileImage"
    src="/uploads/default.png"
    alt="Profile">

</div>


</header>




<div class="profile-card" id="profileCard">


<h3>My Profile</h3>



<!-- Profile Image -->

<div class="field" style="text-align:center;">


<img 
id="profileImage"
class="profile-img"
src="/uploads/default.png">


<br><br>


<input 
type="file"
id="photo"
accept="image/*">


<button 
class="update-btn"
onclick="uploadProfileImage()">

Update Profile Image

</button>


</div>





<!-- Name -->

<div class="field">

<label>Name</label>


<input 
type="text"
id="name"
disabled>


</div>





<!-- Email -->

<div class="field">


<label>Email</label>


<input 
type="email"
id="email"
disabled>


</div>





<!-- Password -->

<div class="field">


<label>Password</label>


<input 
type="password"
id="password"
placeholder="Enter new password"
disabled>


</div>





<button 
class="edit-btn"
onclick="enableEdit()">

Edit Profile

</button>





<button 
class="save-btn"
onclick="updateProfile()">

Save Profile

</button>





<button 
class="close-btn"
onclick="toggleProfile()">

Close

</button>





<button 
class="logout-btn"
onclick="logout()">

Logout

</button>



</div>




<script src="userHomePage.js"></script>


</body>

</html>
