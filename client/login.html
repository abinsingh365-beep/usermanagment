<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

<form id="loginForm">
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button type="submit" id="loginBtn">Login</button><br>
    <span id="email-err"></span>
    <span id="pass-err"></span>


</form>
<a href="./forgotPassword.html">forgotPassword</a>

<script src="login.js"></script>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00c6ff);
}

form{
    width:360px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
    animation:fadeIn .5s ease;
}

form::before{
    content:"Login";
    font-size:30px;
    font-weight:bold;
    color:white;
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:none;
    outline:none;
    border-radius:8px;
    font-size:16px;
    background:white;
    transition:.3s;
}

input:focus{
    box-shadow:0 0 10px #fff;
    transform:scale(1.02);
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#1565c0;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0d47a1;
    transform:translateY(-2px);
}

button:active{
    transform:scale(.98);
}

#email-err,
#pass-err{
    color:#ffeb3b;
    font-size:14px;
    margin-top:5px;
    margin-bottom:10px;
    display:block;
}

a{
    position:absolute;
    margin-top:340px;
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

a:hover{
    text-decoration:underline;
    color:#ffe082;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:420px){

form{
    width:90%;
    padding:30px;
}

a{
    margin-top:320px;
}

}
</style>

</body>
</html>
