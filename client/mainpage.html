<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management System</title>
  <link rel="stylesheet" href="./mainpage.css">

</head>

<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    .form-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-box input {
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .form-box input:focus {
      border-color: #667eea;
    }

    .btn-box {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .btn-box button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s;
    }

    .add-btn {
      background: #28a745;
    }

    .update-btn {
      background: #007bff;
    }

    .logout-btn {
      background: #dc3545;
    }

    .add-btn:hover {
      background: #218838;
    }

    .update-btn:hover {
      background: #0056b3;
    }

    .logout-btn:hover {
      background: #c82333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    thead {
      background: #667eea;
      color: white;
    }

    th,
    td {
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    tbody tr:hover {
      background: #f5f5f5;
    }

    @media (max-width: 768px) {
      .btn-box {
        flex-direction: column;
      }

      .btn-box button {
        width: 100%;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>

<body>


    <div class="container">

      <h1>User Management System</h1>

      <div class="form-box">

        <input type="hidden" id="userId">

        <input type="text" placeholder="Enter Name" id="name">

        <input type="email" placeholder="Enter Email" id="email">

        <input type="password" placeholder="Enter Password" id="password">

        <input type="text" placeholder="Enter User Type" id="userType">

      </div>

      <div class="btn-box">

        <button class="add-btn" onclick="addUser()">
          Add User
        </button>

        <button class="update-btn" onclick="updateUser()">
          Update User
        </button>

        <button class="logout-btn" onclick="logout()">
          Logout
        </button>

      </div>

      <table>

        <thead>

          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>User Type</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody id="userTable">

        </tbody>

      </table>

    </div>

  <input type="text" id="taskInput" placeholder="Enter Task">
  <button onclick="addTask()">Add Task</button>

  <h3>Tasks</h3>
  <ul id="adminTaskList"></ul> -->

</body>

</html>
